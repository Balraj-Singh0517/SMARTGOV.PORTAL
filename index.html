    <script>
      // Gracefully prevent unhandled dev websocket rejection alerts in iframe container environment
      window.addEventListener('unhandledrejection', function(event) {
        const msg = (event && event.reason && (event.reason.message || String(event.reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        const msg = (event && (event.message || '')) || '';
        if (msg.includes('[vite] failed to connect to websocket') || (msg.includes('WebSocket') && msg.includes('closed'))) {
          event.preventDefault();
        }
      });
    </script>
